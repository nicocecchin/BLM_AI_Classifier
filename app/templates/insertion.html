{% extends 'base.html' %}

{% block content %}
<div class="container">
  <h2 id="insertionTitle" class="mb-4">Inserimento nuovo materiale</h2>

  <!-- Descrizioni italiane -->
  <div class="mb-4">
    <label id="labelDescIt" class="form-label">Descrizione breve (Italiano)</label>
    <div id="descIt" class="list-group">
      <!-- suggestions will be injected here -->
    </div>
  </div>

  <!-- Descrizioni inglesi -->
  <div class="mb-4">
    <label id="labelDescEn" class="form-label">Descrizione breve (Inglese)</label>
    <div id="descEn" class="list-group">
      <!-- suggestions will be injected here -->
    </div>
  </div>

  <!-- Pulsanti finali -->
  <div class="d-flex gap-3">
    <button id="createBtn" class="btn btn-success" disabled>Submit</button>
    <button id="cancelBtn" class="btn btn-secondary">Cancel</button>
  </div>
</div>

<script src="{{ url_for('static', filename='insertion_script.js') }}"></script>
{% endblock %}
